<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocks helper · Simulation League</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../../favicon.png">
<!-- THE LEAGUE'S SECOND HELPER MODULE — the BLOCKS page (FS).
     Scratch-style stacks that read and write THE SAME rules file the AI
     helper saves (one storage key per division, two views), so
     blocks ⇆ AI-helper rules ⇆ Python convert freely. The only thing it
     ever hands the game is a real Python file.
     ماژول هلپر دوم لیگ — صفحه‌ی بلاکی: بلاک‌ها را مثل اسکرچ بچین،
     همان فایل قانون‌های هلپر ۱ ساخته می‌شود و خروجی، پایتونِ واقعی است. -->
<link rel="stylesheet" href="blocks.css">
<link rel="stylesheet" href="../../../assets/ui-icons.css">
<script defer src="../../../assets/ui-icons.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo icon-logo"><svg class="ui-icon" aria-hidden="true"><use href="../../../assets/ui-icons.svg#blocks"/></svg></span>
    <div>
      <b id="uiTitle">Blocks helper</b>
      <span id="subTitle">First Step · Vacuum league</span>
    </div>
  </div>
  <div class="topbtns">
    <button class="btn ghost" id="themeBtn" type="button" title="روشن / تاریک">&#9728;&#65039;</button>
    <input id="teamNameIn" class="teamname" type="text" maxlength="40" placeholder="نام تیم · team name" title="نام تیم شما — داخل فایل پایتون نوشته می‌شود تا داور بداند این کد مال کیست">
    <button class="btn ghost" id="openPyBtn" type="button" title="فایل پایتونی که همین صفحه ساخته را باز کنید و ادامه بدهید">📥 باز کردن فایل پایتون</button>
    <input id="openPyFile" type="file" accept=".py,text/x-python,text/plain" hidden>
    <button class="btn ghost" id="resetBtn" type="button">از نو</button>
    <a class="btn ghost" id="backLink" href="../../../index.html">&#8594; برگرد به بازی</a>
  </div>
</header>

<main class="wrap">
  <!-- the palette: tap a block, it lands in the selected stack -->
  <section class="card palcard">
    <h2 id="h2Pal"><span class="step">1</span> Blocks</h2>
    <p class="hint" id="palHint"></p>
    <div class="palhead" id="palHeadSens"></div>
    <div id="palSens" class="pal"></div>
    <div class="palhead" id="palHeadActs"></div>
    <div id="palActs" class="pal"></div>
  </section>

  <!-- the workspace: the rule stacks, in order = the if / elif chain -->
  <section class="card workcard">
    <h2 id="h2Work"></h2>
    <button class="addbtn" id="addRule" type="button">+ قانون جدید</button>
    <div id="stacks"></div>
  </section>
</main>

<!-- the live Python — the same file the match runs -->
<section class="wrapfull">
  <section class="card codecard">
    <h2 id="h2Code"></h2>
    <pre id="code"></pre>
  </section>
</section>

<footer class="bar">
  <span class="barhint" id="barHint"></span>
  <button class="btn ghost" id="dlPyBtn" type="button">&#11015; فایل پایتون</button>
  <input type="file" id="pyFile" accept=".py,text/x-python" style="display:none">
  <button class="btn go" id="playBtn" type="button">&#9654; بازی با این کد</button>
</footer>

<div id="toast" class="toast"></div>

<script src="blocks.js"></script>
</body>
</html>
