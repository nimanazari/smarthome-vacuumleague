<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocks helper · Smart Home League</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../../favicon.png">
<!-- THE LEAGUE'S SECOND HELPER MODULE — the BLOCKS page (FS and U14).
     A real Scratch-style editor: drag puzzle blocks out of the palette,
     snap them under a hat block or inside an "if … then" block, and the
     Python of exactly those blocks is written live underneath. It reads
     and writes THE SAME rules file the AI helper saves (one storage key
     per division, two views), so blocks ⇆ AI-helper rules ⇆ Python
     convert freely. The only thing it ever hands the game is real Python.
     ماژول هلپر دوم لیگ — صفحه‌ی بلاکی: بلوک‌ها را مثل اسکرچ بکش و بچین؛
     همان فایل قانون‌های هلپر ۱ ساخته می‌شود و خروجی، پایتونِ واقعی است. -->
<link rel="stylesheet" href="blocks.css">
<link rel="stylesheet" href="../../../assets/ui-icons.css">
<script defer src="../../../assets/ui-icons.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo icon-logo"><svg class="ui-icon" aria-hidden="true"><use href="../../../assets/ui-icons.svg#blocks"/></svg></span>
    <div>
      <b id="uiTitle">Blocks helper</b>
      <span id="subTitle">First Step · Vacuum league</span>
    </div>
  </div>
  <div class="topbtns">
    <button class="btn ghost" id="themeBtn" type="button" title="روشن / تاریک">&#9728;&#65039;</button>
    <input id="teamNameIn" class="teamname" type="text" maxlength="40" placeholder="نام تیم · team name" title="نام تیم شما — داخل فایل پایتون نوشته می‌شود تا داور بداند این کد مال کیست">
    <select id="mapNoIn" class="teamname" title="این برنامه برای کدام مپ مسابقه است؟ اسم فایل rN_تیم.py می‌شود" style="width:auto;min-width:5.5em"><option value="">مپ؟</option><option value="1">مپ ۱</option><option value="2">مپ ۲</option><option value="3">مپ ۳</option><option value="4">مپ ۴</option><option value="5">مپ ۵</option></select>
    <button class="btn ghost" id="openPyBtn" type="button">📥 باز کردن فایل پایتون</button>
    <input id="openPyFile" type="file" accept=".py,text/x-python,text/plain" hidden>
    <button class="btn ghost" id="resetBtn" type="button">از نو</button>
    <a class="btn ghost" id="backLink" href="../../../index.html">&#8594; برگرد به بازی</a>
  </div>
</header>

<main class="wrap">
  <!-- the palette: drag a block out, or tap it and it snaps into the selected script -->
  <section class="card palcard" id="palcard">
    <h2 id="h2Pal"><span class="step">1</span> Blocks</h2>
    <p class="hint" id="palHint"></p>
    <div class="palgroup">
      <h3 class="pg ctrl" id="palHeadCtrl"></h3>
      <div id="palCtrl" class="pal"></div>
    </div>
    <div class="palgroup">
      <h3 class="pg sens" id="palHeadSens"></h3>
      <div id="palSens" class="pal"></div>
    </div>
    <div class="palgroup">
      <h3 class="pg motion" id="palHeadActs"></h3>
      <div id="palActs" class="pal"></div>
    </div>
    <p class="hint small" id="trashHint"></p>
  </section>

  <!-- the workspace: the scripts. Rules first (top = asked first), the plan last -->
  <section class="card workcard">
    <h2 id="h2Work"></h2>
    <div class="worktools">
      <button class="btn small" id="addRule" type="button">+ قانون جدید</button>
      <span class="hint" id="workHint"></span>
    </div>
    <div id="ws" class="ws"></div>
  </section>
</main>

<!-- the live Python — the same file the match runs -->
<section class="wrapfull">
  <section class="card codecard">
    <h2 id="h2Code"></h2>
    <pre id="code"></pre>
  </section>
</section>

<footer class="bar">
  <span class="barhint" id="barHint"></span>
  <button class="btn ghost" id="copyBtn" type="button">کپی پایتون</button>
  <button class="btn ghost" id="dlPyBtn" type="button">&#11015; فایل پایتون</button>
  <button class="btn go" id="playBtn" type="button">&#9654; بازی با این کد</button>
</footer>

<div id="toast" class="toast"></div>

<script src="blocks.js"></script>
</body>
</html>
